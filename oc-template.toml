schema = 1

[template]
name = "OpenComputer Coder"
description = "The first OpenComputer agentic software factory template: a coding agent that edits connected repositories and verifies changes through repository-owned workflows."
documentation = "https://github.com/diggerhq/opencomputer-native-coder"
default_project_name = "opencomputer-coder"

[template.first_run]
agent = "coder"
prompt = "Verify GitHub access, list the repositories available to this project, and report setup readiness. Do not clone repositories, change files, push, or deploy."

[template.connections.github]
description = "Select only the GitHub repositories this coding agent is allowed to read and change."
